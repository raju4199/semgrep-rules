rules:
- id: spring-ldap-anonymous-read-only-yaml
  patterns:
  - pattern-inside: |
      spring:
        ...
        ldap:
          ...
  - pattern-either:
    - pattern: |
        anonymous-read-only: true
    - pattern: |
        anonymousReadOnly: true
  message: >-
    spring.ldap.anonymous-read-only is enabled, so read operations are done
    without authenticating to the LDAP server. Anyone who can reach the
    application can then read whatever the anonymous LDAP user can see. Set
    spring.ldap.username and spring.ldap.password instead.
  severity: WARNING
  languages: [yaml]
  metadata:
    cwe:
    - 'CWE-1390: Weak Authentication'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://docs.spring.io/spring-boot/appendix/application-properties/index.html#application-properties.data.spring.ldap.anonymous-read-only
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
    category: security
    technology:
    - spring
    - ldap
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
